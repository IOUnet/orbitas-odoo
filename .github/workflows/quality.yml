name: Quality

on:
  push:
  pull_request:

jobs:
  static:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install static tooling
        run: python -m pip install --disable-pip-version-check ruff
      - name: Python syntax
        run: python -m compileall -q orbitas_connector
      - name: XML syntax
        run: python tools/check_xml.py
      - name: Ruff
        run: ruff check orbitas_connector tools
